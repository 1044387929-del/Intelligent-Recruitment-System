[project]
name = "my-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13,<4"
dependencies = [
    "alembic>=1.18.4",
    "fastapi>=0.135.3",
    "psycopg>=3.3.3",
    "pwdlib[argon2]>=0.3.0",
    "pydantic[email]>=2.12.5",
    "pydantic-settings>=2.13.1",
    "shortuuid>=1.0.13",
    "sqlalchemy>=2.0.49",
    "uvicorn>=0.44.0",
    "pyjwt>=2.12.1",
    "redis>=4.6,<5",
    "fastapi-cache2[redis]==0.2.2",
    "fastapi-mail>=1.6.2",
    "loguru>=0.7.3",
    "pyngrok>=8.1.2",
    "httpx>=0.28.1",
    "pywin32>=311",
    "pymupdf>=1.27.2.3",
    "aiofiles>=25.1.0",
    "python-multipart>=0.0.28",
    "langchain>=1.2.18",
    "asgiref>=3.11.1",
    "langchain-openai>=1.2.1",
    "langchain-core>=1.3.3",
    "langgraph>=1.1.10",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true
